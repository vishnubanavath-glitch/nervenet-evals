          change: fell more than 50%, fell up to 50%, rose up to 50%, rose more than 50%?
        expected_sql: >
          WITH a AS (SELECT service_number, netbilled_units AS u FROM meter_readings
                     WHERE SUBSTRING(readingdate, 4, 7) = '04-2026' AND billflag = 'S'),
               j AS (SELECT service_number, netbilled_units AS u FROM meter_readings
                     WHERE SUBSTRING(readingdate, 4, 7) = '06-2026' AND billflag = 'S'),
               p AS (SELECT 100.0 * (j.u - a.u) / a.u AS pct FROM a JOIN j USING (service_number) WHERE a.u > 0)
          SELECT COUNT(*) FROM p
          GROUP BY CASE WHEN pct < -50 THEN 1 WHEN pct < 0 THEN 2 WHEN pct <= 50 THEN 3 ELSE 4 END
        match: contains
        expected_answer: |
          1. 45,878
          2. 35,418
          3. 30,653
          4. 8,007

