# =================================================================================================
# CHAT GOLDEN QUESTIONS - TGSPDCL meter readings (MySQL source "tgspdcl", table meter_readings)
# Used by the chat evaluation (scripts/eval_chat.py). Expected answers are not stored: every expected_sql
# is run on the reference CSV (dataset.toml -> reference_path) when an evaluation or preview runs.
# =================================================================================================
#
# One case = one chat; several turns = one conversation.
#   id, level (easy | medium | hard | hardest | god | feature | conversation | robustness), tags
#   notes     meanings/assumptions to confirm
#   labels    words the chat may show instead of a code, e.g. S: [billed]
#   turns:
#     question           what the user types
#     expected_sql       real-name SQL run on the CSV (DuckDB) = the answer key
#     match              rows (exactly these rows) | contains (these rows appear) | none (no data check)
#     expected_behavior  what a good answer must do (graded by the Opus judge)
#     expected_answer    the answer a correct reply gives: numbered figures in Indian format plus the key
#                        insights (highest, lowest, total). GENERATED from the CSV - refresh with
#                        `uv run python scripts/write_expected_answers.py --dataset <name>`, don't hand-edit numbers.
#     expect             chart: bar|line|area|point|arc|echarts|any  report: true/false
#                        questions_form: true/false/optional  followups: true/false  tools: false
#                        table_title: "..."
#   Answer-key conventions: month = SUBSTRING(readingdate, 4, 7); date = STRPTIME(LEFT(readingdate, 10), '%d-%m-%Y');
#   consumption = presentreading - previous_kwh_reading; text compared ignoring case (like MySQL).
#   Numbers match within 0.51 (rounding); counts must be exact.
#
# =================================================================================================

cases:

