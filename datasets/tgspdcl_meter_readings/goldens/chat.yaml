  - id: G030
    level: god
    tags: [bridge, month, per-connection]
    notes: >
      Bridge: June total - April total = (change for connections billed both months) + (June bills of connections
      billed only in June) - (April bills of connections billed only in April).
    turns:
      - question: >
          Explain the change in total bill amount from April to June 2026 as a bridge: the April total, the change
          from connections billed in both months, the bills of connections billed only in June, the bills of
          connections billed only in April, and the June total.
        expected_sql: >
          WITH a AS (SELECT service_number, billamount AS b FROM meter_readings
                     WHERE SUBSTRING(readingdate, 4, 7) = '04-2026' AND billflag = 'S'),
               j AS (SELECT service_number, billamount AS b FROM meter_readings
                     WHERE SUBSTRING(readingdate, 4, 7) = '06-2026' AND billflag = 'S')
          SELECT (SELECT SUM(b) FROM a) AS april_total_bill,
                 (SELECT SUM(j.b - a.b) FROM a JOIN j USING (service_number)) AS change_billed_both_months,
                 (SELECT SUM(b) FROM j WHERE service_number NOT IN (SELECT service_number FROM a)) AS billed_only_in_june,
                 (SELECT SUM(b) FROM a WHERE service_number NOT IN (SELECT service_number FROM j)) AS billed_only_in_april,
                 (SELECT SUM(b) FROM j) AS june_total_bill
        match: rows
        expected_answer: |
          - april total bill: ₹11,68,06,367.49
          - change billed both months: ₹4,79,98,235.60
          - billed only in june: ₹1,83,10,852.88
          - billed only in april: ₹1,11,68,544.14
          - june total bill: ₹17,19,46,911.83

