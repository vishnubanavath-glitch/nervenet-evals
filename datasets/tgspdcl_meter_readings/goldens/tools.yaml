# =================================================================================================
# TOOLS GOLDEN TESTS - TGSPDCL meter readings (MySQL source "tgspdcl", table meter_readings)
# Used by the tools evaluation (scripts/eval_tools.py): MCP tools called directly, no AI.
# Expected results for match_reference / kpi_matches are calculated from the reference CSV at run time.
# =================================================================================================
#
#   id, area, title, notes
#   sql                with {t:table} / {c:column}: sent masked to the app, run with real names on the CSV
#   raw_sql            sent exactly as written;  raw_sql_template: as written, placeholders filled
#   tool + args        call a tool directly (e.g. discover) with these arguments
#   query_source       source_id to query (default: this dataset's source)
#   limit              row limit sent with the query
#   {source} = this dataset's source_id;  {o:<source_id>:<table>} = a table token from another source
#   expect: match_reference | rejected | masked | masked_headers | row_limit (+ rows) | capped
#           | kpi_matches (+ kpi_column) | not_listed (+ other_source)
#   user: test-user label from dataset.toml (default full_access)
# =================================================================================================

cases:

  # ================================================================================================
  # CORRECT NUMBERS - masked SQL on MySQL must equal the same SQL on the CSV   [88 tests]
  # ================================================================================================

  - id: R01
    area: results
    title: Total number of records
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R02
    area: results
    title: Totals of bill amount, total amount and net billed units
    sql: >
      SELECT SUM({c:billamount}) AS bill, SUM({c:totalamount}) AS total, SUM({c:netbilled_units}) AS units
      FROM {t:meter_readings}
    expect: match_reference

  - id: R03
    area: results
    title: Records per sub-division (code and name)
    sql: >
      SELECT {c:subdivcd} AS code, {c:subdivname} AS sub_division, COUNT(*) AS n
      FROM {t:meter_readings} GROUP BY {c:subdivcd}, {c:subdivname} ORDER BY code, sub_division
    expect: match_reference

  - id: R04
    area: results
    title: Average bill amount per category
    sql: >
      SELECT {c:category} AS category, AVG({c:billamount}) AS avg_bill
      FROM {t:meter_readings} GROUP BY {c:category} ORDER BY category
    expect: match_reference

  - id: R05
    area: results
    title: Minimum and maximum contracted load
    sql: SELECT MIN({c:contracted_load}) AS min_load, MAX({c:contracted_load}) AS max_load FROM {t:meter_readings}
    expect: match_reference

  - id: R06
    area: results
    title: Distinct service numbers
    sql: SELECT COUNT(DISTINCT {c:service_number}) AS services FROM {t:meter_readings}
    expect: match_reference

  - id: R07
    area: results
    title: Records per bill flag (text values, including empty)
    sql: >
      SELECT {c:billflag} AS flag, COUNT(*) AS n FROM {t:meter_readings}
      GROUP BY {c:billflag} ORDER BY n DESC
    expect: match_reference

  - id: R08
    area: results
    title: Records with no matched source (NULL filter)
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:matched_source} IS NULL
    expect: match_reference

  - id: R09
    area: results
    title: Total amount per reading month (text date, MM-YYYY)
    sql: >
      SELECT SUBSTRING({c:readingdate}, 4, 7) AS month, SUM({c:totalamount}) AS total, COUNT(*) AS n
      FROM {t:meter_readings} WHERE {c:readingdate} IS NOT NULL
      GROUP BY SUBSTRING({c:readingdate}, 4, 7) ORDER BY month
    expect: match_reference

  - id: R10
    area: results
    title: Top 10 tariff categories by bill amount
    sql: >
      SELECT {c:tariffcat} AS tariff, SUM({c:billamount}) AS bill
      FROM {t:meter_readings} GROUP BY {c:tariffcat} ORDER BY bill DESC, tariff LIMIT 10
    expect: match_reference

  - id: R11
    area: results
    title: Combined filter (category 1 and bill over 1000)
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:category} = 1 AND {c:billamount} > 1000
    expect: match_reference

  - id: R12
    area: results
    title: HAVING - categories with more than 1000 records
    sql: >
      SELECT {c:category} AS category, COUNT(*) AS n FROM {t:meter_readings}
      GROUP BY {c:category} HAVING COUNT(*) > 1000 ORDER BY category
    expect: match_reference

  - id: R13
    area: results
    title: CASE buckets of bill amount
    sql: >
      SELECT CASE WHEN {c:billamount} IS NULL THEN 'none'
                  WHEN {c:billamount} < 500 THEN 'a <500'
                  WHEN {c:billamount} < 2000 THEN 'b 500-2000'
                  ELSE 'c 2000+' END AS bucket,
             COUNT(*) AS n
      FROM {t:meter_readings} GROUP BY bucket ORDER BY bucket
    expect: match_reference

  - id: R14
    area: results
    title: Case-insensitive grouping of scan mode
    sql: >
      SELECT UPPER({c:scanmode}) AS mode, COUNT(*) AS n FROM {t:meter_readings}
      GROUP BY UPPER({c:scanmode}) ORDER BY n DESC, mode
    expect: match_reference

  - id: R15
    area: results
    title: CTE - largest sub-division bill total
    sql: >
      WITH s AS (SELECT {c:subdivcd} AS code, SUM({c:billamount}) AS bill FROM {t:meter_readings} GROUP BY {c:subdivcd})
      SELECT code, bill FROM s ORDER BY bill DESC LIMIT 1
    expect: match_reference

  - id: R16
    area: results
    title: Subquery - records in sub-divisions with over 50,000 records
    sql: >
      SELECT COUNT(*) AS n FROM {t:meter_readings}
      WHERE {c:subdivcd} IN (SELECT {c:subdivcd} FROM {t:meter_readings} GROUP BY {c:subdivcd} HAVING COUNT(*) > 50000)
    expect: match_reference

  - id: R17
    area: results
    title: Old vs new arrears totals per sub-division
    sql: >
      SELECT {c:subdivname} AS sub_division, SUM({c:old_arrears}) AS old_arrears, SUM({c:new_arrears}) AS new_arrears
      FROM {t:meter_readings} GROUP BY {c:subdivname} ORDER BY sub_division
    expect: match_reference

  - id: R18
    area: results
    title: Rounded average units per meter phase
    sql: >
      SELECT {c:meter_phase} AS phase, ROUND(AVG({c:netbilled_units}), 2) AS avg_units
      FROM {t:meter_readings} GROUP BY {c:meter_phase} ORDER BY phase
    expect: match_reference

  - id: R19
    area: results
    title: Billed readings
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:billflag} = 'S'
    expect: match_reference

  - id: R20
    area: results
    title: Unbilled readings without a reading date
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:billflag} = 'U' AND {c:readingdate} IS NULL
    expect: match_reference

  - id: R21
    area: results
    title: Net billed units per reading month
    sql: >
      SELECT SUBSTRING({c:readingdate}, 4, 7) AS m, SUM({c:netbilled_units}) AS u FROM {t:meter_readings}
      WHERE {c:readingdate} IS NOT NULL GROUP BY SUBSTRING({c:readingdate}, 4, 7)
    expect: match_reference

  - id: R22
    area: results
    title: Average bill per sub-division (rounded)
    sql: >
      SELECT UPPER({c:subdivname}) AS s, ROUND(AVG({c:billamount}), 2) AS a FROM {t:meter_readings}
      GROUP BY UPPER({c:subdivname})
    expect: match_reference

  - id: R23
    area: results
    title: Distinct service connections per sub-division
    sql: >
      SELECT UPPER({c:subdivname}) AS s, COUNT(DISTINCT {c:service_number}) AS n FROM {t:meter_readings}
      GROUP BY UPPER({c:subdivname})
    expect: match_reference

  - id: R24
    area: results
    title: Lowest and highest bill per section
    sql: >
      SELECT UPPER({c:secname}) AS s, MIN({c:billamount}) AS lo, MAX({c:billamount}) AS hi FROM {t:meter_readings}
      GROUP BY UPPER({c:secname})
    expect: match_reference

  - id: R25
    area: results
    title: Total old and new arrears
    sql: SELECT SUM({c:old_arrears}) AS o, SUM({c:new_arrears}) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R26
    area: results
    title: Readings where new arrears exceed old arrears
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:new_arrears} > {c:old_arrears}
    expect: match_reference

  - id: R27
    area: results
    title: Readings per ERO (case-insensitive, merges the spelling variant)
    sql: >
      SELECT UPPER({c:eroname}) AS e, COUNT(*) AS n FROM {t:meter_readings} GROUP BY UPPER({c:eroname})
    expect: match_reference

  - id: R28
    area: results
    title: Readings per tariff category
    sql: >
      SELECT UPPER({c:tariffcat}) AS t, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:tariffcat} IS NOT NULL
      GROUP BY UPPER({c:tariffcat})
    expect: match_reference

  - id: R29
    area: results
    title: Readings and average bill per consumer category
    sql: >
      SELECT {c:category} AS c, COUNT(*) AS n, ROUND(AVG({c:billamount}), 2) AS a FROM {t:meter_readings}
      WHERE {c:category} IS NOT NULL GROUP BY {c:category}
    expect: match_reference

  - id: R30
    area: results
    title: Net billed units per meter phase
    sql: >
      SELECT {c:meter_phase} AS p, SUM({c:netbilled_units}) AS u FROM {t:meter_readings}
      WHERE {c:meter_phase} IS NOT NULL GROUP BY {c:meter_phase}
    expect: match_reference

  - id: R31
    area: results
    title: Readings per subsidy flag
    sql: >
      SELECT {c:subsidy_flag} AS f, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:subsidy_flag} IS NOT NULL
      GROUP BY {c:subsidy_flag}
    expect: match_reference

  - id: R32
    area: results
    title: Readings per Gruha Jyothi flag
    sql: SELECT UPPER({c:gj_flag}) AS g, COUNT(*) AS n FROM {t:meter_readings} GROUP BY UPPER({c:gj_flag})
    expect: match_reference

  - id: R33
    area: results
    title: Readings per Gruha Jyothi billed flag
    sql: >
      SELECT {c:gjbilledflag} AS f, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:gjbilledflag} IS NOT NULL
      GROUP BY {c:gjbilledflag}
    expect: match_reference

  - id: R34
    area: results
    title: Readings per scan mode
    sql: >
      SELECT UPPER({c:scanmode}) AS m, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:scanmode} IS NOT NULL
      GROUP BY UPPER({c:scanmode})
    expect: match_reference

  - id: R35
    area: results
    title: Readings per IRDA flag
    sql: >
      SELECT {c:irda_flag} AS f, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:irda_flag} IS NOT NULL
      GROUP BY {c:irda_flag}
    expect: match_reference

  - id: R36
    area: results
    title: Readings per matched source
    sql: >
      SELECT UPPER({c:matched_source}) AS s, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:matched_source} IS NOT NULL
      GROUP BY UPPER({c:matched_source})
    expect: match_reference

  - id: R37
    area: results
    title: Readings per reading type
    sql: >
      SELECT UPPER({c:readingtype}) AS r, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:readingtype} IS NOT NULL
      GROUP BY UPPER({c:readingtype})
    expect: match_reference

  - id: R38
    area: results
    title: Readings per analysis remark
    sql: >
      SELECT UPPER({c:analysisremark}) AS r, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:analysisremark} IS NOT NULL
      GROUP BY UPPER({c:analysisremark})
    expect: match_reference

  - id: R39
    area: results
    title: Readings per day in June 2026
    sql: >
      SELECT LEFT({c:readingdate}, 10) AS d, COUNT(*) AS n FROM {t:meter_readings}
      WHERE SUBSTRING({c:readingdate}, 4, 7) = '06-2026' GROUP BY LEFT({c:readingdate}, 10)
    expect: match_reference

  - id: R40
    area: results
    title: Readings per last-payment year
    sql: >
      SELECT RIGHT({c:last_paid_date}, 4) AS y, COUNT(*) AS n FROM {t:meter_readings}
      WHERE {c:last_paid_date} IS NOT NULL GROUP BY RIGHT({c:last_paid_date}, 4)
    expect: match_reference

  - id: R41
    area: results
    title: Readings per previous-reading month
    sql: >
      SELECT SUBSTRING({c:previous_reading_date}, 4, 7) AS m, COUNT(*) AS n FROM {t:meter_readings}
      WHERE {c:previous_reading_date} IS NOT NULL GROUP BY SUBSTRING({c:previous_reading_date}, 4, 7)
    expect: match_reference

  - id: R42
    area: results
    title: Readings per contracted-load band (CASE)
    sql: >
      SELECT CASE WHEN {c:contracted_load} < 1 THEN 'a <1' WHEN {c:contracted_load} < 2 THEN 'b 1-2'
                  WHEN {c:contracted_load} < 5 THEN 'c 2-5' ELSE 'd 5+' END AS band, COUNT(*) AS n
      FROM {t:meter_readings} WHERE {c:contracted_load} IS NOT NULL GROUP BY band
    expect: match_reference

  - id: R43
    area: results
    title: Billed readings per bill band (CASE)
    sql: >
      SELECT CASE WHEN {c:billamount} < 500 THEN 'a <500' WHEN {c:billamount} <= 2000 THEN 'b 500-2000'
                  WHEN {c:billamount} <= 5000 THEN 'c 2000-5000' ELSE 'd 5000+' END AS band, COUNT(*) AS n
      FROM {t:meter_readings} WHERE {c:billamount} IS NOT NULL GROUP BY band
    expect: match_reference

  - id: R44
    area: results
    title: Readings with more than 40 billing days
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:spotbilldays} > 40
    expect: match_reference

  - id: R45
    area: results
    title: Average billing days per sub-division (rounded)
    sql: >
      SELECT UPPER({c:subdivname}) AS s, ROUND(AVG({c:spotbilldays}), 2) AS d FROM {t:meter_readings}
      GROUP BY UPPER({c:subdivname})
    expect: match_reference

  - id: R46
    area: results
    title: Bill per unit per tariff category (rounded ratio)
    sql: >
      SELECT UPPER({c:tariffcat}) AS t, ROUND(SUM({c:billamount}) / SUM({c:netbilled_units}), 2) AS r
      FROM {t:meter_readings} WHERE {c:tariffcat} IS NOT NULL GROUP BY UPPER({c:tariffcat})
    expect: match_reference

  - id: R47
    area: results
    title: Readings where the present reading is below the previous reading
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:presentreading} < {c:previous_kwh_reading}
    expect: match_reference

  - id: R48
    area: results
    title: Total consumption (present minus previous) on billed readings
    sql: >
      SELECT SUM({c:presentreading} - {c:previous_kwh_reading}) AS c FROM {t:meter_readings} WHERE {c:billflag} = 'S'
    expect: match_reference

  - id: R49
    area: results
    title: Readings whose consumption matches net billed units within 1 unit
    sql: >
      SELECT COUNT(*) AS n FROM {t:meter_readings}
      WHERE ABS(({c:presentreading} - {c:previous_kwh_reading}) - {c:netbilled_units}) < 1
    expect: match_reference

  - id: R50
    area: results
    title: HAVING - sections with more than 40,000 readings
    sql: >
      SELECT UPPER({c:secname}) AS s, COUNT(*) AS n FROM {t:meter_readings} GROUP BY UPPER({c:secname})
      HAVING COUNT(*) > 40000
    expect: match_reference

  - id: R51
    area: results
    title: Top 5 sections by bill amount (with tie-breaker)
    sql: >
      SELECT UPPER({c:secname}) AS s, SUM({c:billamount}) AS b FROM {t:meter_readings} GROUP BY UPPER({c:secname})
      ORDER BY b DESC, s LIMIT 5
    expect: match_reference

  - id: R52
    area: results
    title: Bottom 3 tariff categories by readings (with tie-breaker)
    sql: >
      SELECT UPPER({c:tariffcat}) AS t, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:tariffcat} IS NOT NULL
      GROUP BY UPPER({c:tariffcat}) ORDER BY n, t LIMIT 3
    expect: match_reference

  - id: R53
    area: results
    title: ROW_NUMBER - top section by bill in each sub-division
    sql: >
      WITH t AS (SELECT UPPER({c:subdivname}) AS d, UPPER({c:secname}) AS s, SUM({c:billamount}) AS b,
                 ROW_NUMBER() OVER (PARTITION BY UPPER({c:subdivname}) ORDER BY SUM({c:billamount}) DESC) AS rn
                 FROM {t:meter_readings} GROUP BY UPPER({c:subdivname}), UPPER({c:secname}))
      SELECT d, s, b FROM t WHERE rn = 1
    expect: match_reference

  - id: R54
    area: results
    title: RANK - sections ranked by bill amount
    sql: >
      SELECT UPPER({c:secname}) AS s, SUM({c:billamount}) AS b, RANK() OVER (ORDER BY SUM({c:billamount}) DESC) AS r
      FROM {t:meter_readings} GROUP BY UPPER({c:secname})
    expect: match_reference

  - id: R55
    area: results
    title: SUM() OVER () - each sub-division's share of the bill (rounded)
    sql: >
      SELECT UPPER({c:subdivname}) AS s,
             ROUND(100 * SUM({c:billamount}) / SUM(SUM({c:billamount})) OVER (), 2) AS pct
      FROM {t:meter_readings} GROUP BY UPPER({c:subdivname})
    expect: match_reference

  - id: R56
    area: results
    title: Running total of readings per day in June 2026
    sql: >
      SELECT LEFT({c:readingdate}, 10) AS d, COUNT(*) AS n,
             SUM(COUNT(*)) OVER (ORDER BY LEFT({c:readingdate}, 10)) AS running
      FROM {t:meter_readings} WHERE SUBSTRING({c:readingdate}, 4, 7) = '06-2026' GROUP BY LEFT({c:readingdate}, 10)
    expect: match_reference

  - id: R57
    area: results
    title: Connections billed in both April and June 2026 (pivot per connection)
    sql: >
      SELECT COUNT(*) AS n FROM (SELECT {c:service_number} AS sn,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '04-2026' AND {c:billflag} = 'S' THEN 1 ELSE 0 END) AS a,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '06-2026' AND {c:billflag} = 'S' THEN 1 ELSE 0 END) AS j
        FROM {t:meter_readings} GROUP BY {c:service_number}) x WHERE a = 1 AND j = 1
    expect: match_reference

  - id: R58
    area: results
    title: Connections billed in April but not in June 2026
    sql: >
      SELECT COUNT(*) AS n FROM (SELECT {c:service_number} AS sn,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '04-2026' AND {c:billflag} = 'S' THEN 1 ELSE 0 END) AS a,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '06-2026' AND {c:billflag} = 'S' THEN 1 ELSE 0 END) AS j
        FROM {t:meter_readings} GROUP BY {c:service_number}) x WHERE a = 1 AND j = 0
    expect: match_reference

  - id: R59
    area: results
    title: Average bill change April to June for connections billed in both (rounded)
    sql: >
      SELECT ROUND(AVG(j - a), 2) AS avg_change FROM (SELECT {c:service_number} AS sn,
        SUM(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '04-2026' AND {c:billflag} = 'S' THEN {c:billamount} END) AS a,
        SUM(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '06-2026' AND {c:billflag} = 'S' THEN {c:billamount} END) AS j
        FROM {t:meter_readings} GROUP BY {c:service_number}) x WHERE a IS NOT NULL AND j IS NOT NULL
    expect: match_reference

  - id: R60
    area: results
    title: Distinct meter numbers (normalised)
    sql: SELECT COUNT(DISTINCT UPPER(TRIM({c:meter_number}))) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R61
    area: results
    title: Meter numbers shared by more than one connection
    sql: >
      SELECT COUNT(*) AS n FROM (SELECT UPPER(TRIM({c:meter_number})) AS m FROM {t:meter_readings}
      GROUP BY UPPER(TRIM({c:meter_number})) HAVING COUNT(DISTINCT {c:service_number}) > 1) x
    expect: match_reference

  - id: R62
    area: results
    title: Readings with meter numbers corrupted into scientific notation
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE UPPER({c:meter_number}) LIKE '%E+%'
    expect: match_reference

  - id: R63
    area: results
    title: Distinct distribution transformers
    sql: SELECT COUNT(DISTINCT {c:dtrcode}) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R64
    area: results
    title: COALESCE - readings per scan mode with blanks labelled
    sql: >
      SELECT COALESCE(UPPER({c:scanmode}), 'NONE') AS m, COUNT(*) AS n FROM {t:meter_readings}
      GROUP BY COALESCE(UPPER({c:scanmode}), 'NONE')
    expect: match_reference

  - id: R65
    area: results
    title: NULLIF - overall bill per unit (rounded)
    sql: >
      SELECT ROUND(SUM({c:billamount}) / NULLIF(SUM({c:netbilled_units}), 0), 2) AS r FROM {t:meter_readings}
    expect: match_reference

  - id: R66
    area: results
    title: BETWEEN - bills from 1,000 to 2,000
    sql: SELECT COUNT(*) AS n FROM {t:meter_readings} WHERE {c:billamount} BETWEEN 1000 AND 2000
    expect: match_reference

  - id: R67
    area: results
    title: IN list - readings in two sections
    sql: >
      SELECT UPPER({c:secname}) AS s, COUNT(*) AS n FROM {t:meter_readings}
      WHERE UPPER({c:secname}) IN ('KOMPALLY', 'ALIABAD') GROUP BY UPPER({c:secname})
    expect: match_reference

  - id: R68
    area: results
    title: Connections with a June reading but no April reading
    sql: >
      SELECT COUNT(*) AS n FROM (SELECT {c:service_number} AS sn,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '04-2026' THEN 1 ELSE 0 END) AS a,
        MAX(CASE WHEN SUBSTRING({c:readingdate}, 4, 7) = '06-2026' THEN 1 ELSE 0 END) AS j
        FROM {t:meter_readings} GROUP BY {c:service_number}) x WHERE j = 1 AND a = 0
    expect: match_reference

  - id: R69
    area: results
    title: Connections with both a billed and an unbilled reading
    sql: >
      SELECT COUNT(*) AS n FROM (SELECT {c:service_number} AS sn FROM {t:meter_readings} GROUP BY {c:service_number}
      HAVING SUM(CASE WHEN {c:billflag} = 'S' THEN 1 ELSE 0 END) > 0
         AND SUM(CASE WHEN {c:billflag} = 'U' THEN 1 ELSE 0 END) > 0) x
    expect: match_reference

  - id: R70
    area: results
    title: UNION ALL - billed and unbilled counts as two rows
    sql: >
      SELECT 'billed' AS k, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:billflag} = 'S'
      UNION ALL SELECT 'unbilled' AS k, COUNT(*) AS n FROM {t:meter_readings} WHERE {c:billflag} = 'U'
    expect: match_reference

  - id: R71
    area: results
    title: Pivot - billed and unbilled per month
    sql: >
      SELECT SUBSTRING({c:readingdate}, 4, 7) AS m,
             SUM(CASE WHEN {c:billflag} = 'S' THEN 1 ELSE 0 END) AS billed,
             SUM(CASE WHEN {c:billflag} = 'U' THEN 1 ELSE 0 END) AS unbilled
      FROM {t:meter_readings} WHERE {c:readingdate} IS NOT NULL GROUP BY SUBSTRING({c:readingdate}, 4, 7)
    expect: match_reference

  - id: R72
    area: results
    title: Sections per sub-division
    sql: >
      SELECT UPPER({c:subdivname}) AS d, COUNT(DISTINCT UPPER({c:secname})) AS n FROM {t:meter_readings}
      GROUP BY UPPER({c:subdivname})
    expect: match_reference

  - id: R73
    area: results
    title: Distinct consumer names (normalised)
    sql: SELECT COUNT(DISTINCT UPPER(TRIM({c:name}))) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R74
    area: results
    title: Distinct section names after trimming
    sql: SELECT COUNT(DISTINCT UPPER(TRIM({c:secname}))) AS n FROM {t:meter_readings}
    expect: match_reference

  - id: R75
    area: results
    title: Unbilled percentage per section (rounded)
    sql: >
      SELECT UPPER({c:secname}) AS s,
             ROUND(100 * SUM(CASE WHEN {c:billflag} = 'U' THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct
      FROM {t:meter_readings} GROUP BY UPPER({c:secname})
    expect: match_reference

  - id: R76
    area: results
    title: Nested aggregate - average of section bill totals (rounded)
    sql: >
      SELECT ROUND(AVG(b), 2) AS a FROM (SELECT UPPER({c:secname}) AS s, SUM({c:billamount}) AS b
      FROM {t:meter_readings} GROUP BY UPPER({c:secname})) x
    expect: match_reference

  - id: R77
    area: results
