    kpi_column: u

  - id: K04
    area: kpi
    title: KPI of readings per month
    sql: >
      SELECT SUBSTRING({c:readingdate}, 4, 7) AS m, COUNT(*) AS n FROM {t:meter_readings}
      WHERE {c:readingdate} IS NOT NULL GROUP BY SUBSTRING({c:readingdate}, 4, 7)
    expect: kpi_matches
    kpi_column: n

  - id: K05
    area: kpi
    title: KPI of average bill per tariff (rounded)
    sql: >
      SELECT UPPER({c:tariffcat}) AS t, ROUND(AVG({c:billamount}), 2) AS a FROM {t:meter_readings}
      WHERE {c:tariffcat} IS NOT NULL GROUP BY UPPER({c:tariffcat})
    expect: kpi_matches
    kpi_column: a

  - id: K06
    area: kpi
    title: KPI of a single-row total
    sql: SELECT SUM({c:billamount}) AS total FROM {t:meter_readings}
    expect: kpi_matches
    kpi_column: total

  - id: K07
    area: kpi
    title: KPI with negative values (lowest old arrears per section)
    sql: >
      SELECT UPPER({c:secname}) AS s, MIN({c:old_arrears}) AS mn FROM {t:meter_readings} GROUP BY UPPER({c:secname})
    expect: kpi_matches
    kpi_column: mn

  - id: K08
    area: kpi
    title: KPI of new arrears per tariff
    sql: >
      SELECT UPPER({c:tariffcat}) AS t, SUM({c:new_arrears}) AS s FROM {t:meter_readings}
      WHERE {c:tariffcat} IS NOT NULL GROUP BY UPPER({c:tariffcat})
    expect: kpi_matches
    kpi_column: s

  - id: K09
    area: kpi
    title: KPI of a percentage column
    sql: >
      SELECT UPPER({c:secname}) AS s, ROUND(100 * SUM(CASE WHEN {c:billflag} = 'U' THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct
      FROM {t:meter_readings} GROUP BY UPPER({c:secname})
    expect: kpi_matches
